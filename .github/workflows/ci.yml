name: tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Apple Silicon runner: mlx requires arm64 macOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[network]" pytest
      - run: python -m pytest tests/ -q
